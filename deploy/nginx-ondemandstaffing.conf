# OnDemand Staffing — nginx server block
# Install to: /etc/nginx/sites-available/ondemandstaffing
# Enable:     ln -s /etc/nginx/sites-available/ondemandstaffing /etc/nginx/sites-enabled/
#
# Pre-cutover: server_name is "_" (catch-all) so the site answers on the droplet IP.
# At cutover: change server_name to "ondemandstaffing.ca www.ondemandstaffing.ca",
# then run certbot --nginx for HTTPS. Do NOT point DNS here until forms are wired.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/ondemandstaffing;
    index index.html;

    # Clean URLs: /about-us/ -> /about-us/index.html
    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;

    # Long-lived caching for static assets (filenames change on redesign, not content edits)
    location ~* \.(css|js|woff2|png|jpe?g|webp|svg|ico)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Compression
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml;
    gzip_min_length 512;

    # Keep dotfiles and repo internals unreachable (defense in depth; rsync excludes them anyway)
    location ~ /\. { deny all; }
}
