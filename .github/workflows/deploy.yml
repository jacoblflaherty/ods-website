name: Deploy to DigitalOcean

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Rsync site to droplet
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy_key" \
            --exclude='.git*' \
            --exclude='.github' \
            --exclude='deploy' \
            --exclude='server' \
            --exclude='scripts' \
            --exclude='docs' \
            --exclude='*.md' \
            ./ deploy@${{ secrets.DEPLOY_HOST }}:/var/www/ondemandstaffing/

      - name: Smoke test
        run: |
          sleep 2
          curl -sf -o /dev/null "http://${{ secrets.DEPLOY_HOST }}/" && echo "OK /"
          curl -sf -o /dev/null "http://${{ secrets.DEPLOY_HOST }}/home-v2/" && echo "OK /home-v2/"
          curl -sf -o /dev/null "http://${{ secrets.DEPLOY_HOST }}/blog/" && echo "OK /blog/"
